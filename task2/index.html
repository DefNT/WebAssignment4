<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="navbar">
        <span class="brand">Assignment 4</span>
        <div class="nav-links">
            <a href="../task0/index.html">Task 0</a>
            <a href="../task1/index.html">Task 1</a>

            <a href="../task3/index.html">Task 3</a>

        </div>
    </nav>

    <div class="container-center">
        <div class="card-box" style="max-width: 600px;">
            <h2>Bootstrap Form Styling</h2>
            <form action="#">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Name:</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
                        <div class="form-text">Your full name</div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="test@example.com">
                    </div>
                    <div class="col-12">
                        <label for="message" class="form-label">Message:</label>
                        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Write your message..."></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
