<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="navbar">
        <span class="brand">Assignment 4</span>
        <div class="nav-links">
            <a href="../task0/index.html">Task 0</a>
            <a href="../task1/index.html">Task 1</a>
            <a href="../task2/index.html">Task 2</a>
            <a href="../task3/index.html" class="active">Task 3</a>
            <a href="../task4/index.html">Task 4</a>
        </div>
    </nav>

    <div class="container-center">
        <div class="card-box" style="max-width: 600px;">
            <h2>Bootstrap Validation</h2>
            <form action="#" class="was-validated">
                <div class="form-group mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required minlength="2">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Name is required</div>
                </div>
                <div class="form-group mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="test@example.com" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Email is required</div>
                </div>
                <div class="form-group mb-3">
                    <label for="message" class="form-label">Message:</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Write your message..." required minlength="10"></textarea>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Message is required</div>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
